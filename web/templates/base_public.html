<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SeaVix{% endblock %}</title>
  <meta name="theme-color" content="#F7F8FA">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
  <link rel="shortcut icon" href="/static/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="sv-public">
    {% block public_header %}
    <header class="sv-public-header">
      <a class="sv-public-brand" href="/" aria-label="SeaVix">
        <img src="/static/brand/seavix-logo.png" alt="SeaVix">
      </a>
      <nav class="sv-public-nav" aria-label="Account">
        <a href="/login">Sign in</a>
        <a class="sv-public-cta" href="/register">Register</a>
      </nav>
    </header>
    {% endblock %}

    <main class="sv-public-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="sv-public-footer">
      <div class="sv-container">
        <span>© 2026 SeaVix — marine survey coordination.</span>
        <span><a href="mailto:hello@seavix.ai">hello@seavix.ai</a></span>
      </div>
    </footer>
  </div>
  {#- 32d: Alpine for the public RFQ form's survey-type chip picker (inert
      everywhere else — it only touches x-*/@ attributes). -#}
  <script defer src="/static/vendor/alpine.min.js"></script>
</body>
</html>
