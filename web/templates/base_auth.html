<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SeaVix{% endblock %}</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
  <link rel="shortcut icon" href="/static/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="sv-auth">
    <a class="sv-auth-logo" href="/" aria-label="SeaVix">
      <img src="/static/brand/seavix-logo.png" alt="SeaVix">
    </a>
    <main class="sv-auth-card">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
