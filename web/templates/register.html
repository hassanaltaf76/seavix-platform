{% extends "base_auth.html" %}{% block title %}Register — SeaVix{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="sv-auth-sub">Set up your organization in a couple of minutes.</p>
{% if error %}<p class="sv-form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/register" class="sv-auth-form" id="register-form" novalidate>
  <div class="sv-field">
    <label for="org_name">Organization name</label>
    <input id="org_name" name="org_name" required maxlength="200" autocomplete="organization"
           value="{{ form.get('org_name', '') }}">
  </div>
  <div class="sv-field">
    <label for="org_type">Organization type</label>
    <select id="org_type" name="org_type" required>
      <option value="" {% if not form.get('org_type') %}selected{% endif %} disabled>Select…</option>
      <option value="agent" {% if form.get('org_type') == 'agent' %}selected{% endif %}>Port Agent</option>
      <option value="management" {% if form.get('org_type') == 'management' %}selected{% endif %}>Management Company</option>
      <option value="survey_company" {% if form.get('org_type') == 'survey_company' %}selected{% endif %}>Surveyor</option>
    </select>
  </div>
  <div class="sv-field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           value="{{ form.get('email', '') }}">
  </div>
  <div class="sv-field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6"
           autocomplete="new-password">
  </div>
  <div class="sv-field">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
           autocomplete="new-password">
    <p class="sv-field-error" id="password-mismatch" hidden>Passwords do not match.</p>
  </div>
  <button type="submit">Create account</button>
</form>
<div class="sv-auth-links">
  <p>Already have an account? <a href="/login">Sign in</a></p>
</div>
<script>
document.getElementById("register-form").addEventListener("submit", function (e) {
  var p = document.getElementById("password");
  var c = document.getElementById("confirm_password");
  var err = document.getElementById("password-mismatch");
  if (p.value !== c.value) {
    e.preventDefault();
    err.hidden = false;
    c.focus();
  } else {
    err.hidden = true;
  }
});
</script>
{% endblock %}
