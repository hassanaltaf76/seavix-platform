[project]
name = "seavix-web"
version = "0.1.0"
description = "SeaVix public web app — server-rendered FastAPI + Jinja2."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.130",
    "uvicorn>=0.35",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webapp"]
