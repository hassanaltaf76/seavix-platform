[project]
name = "seavix-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "seavix-ports",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
seavix-ports = { workspace = true }
