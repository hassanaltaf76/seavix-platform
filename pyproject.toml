[project]
name = "seavix-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "seavix-identity",
    "seavix-ports",
    "seavix-registry",
    "seavix-web",
    "seavix-work",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
    "web",
]

[tool.uv.sources]
seavix-ports = { workspace = true }
seavix-identity = { workspace = true }
seavix-web = { workspace = true }
seavix-registry = { workspace = true }
seavix-work = { workspace = true }
