[project]
name = "seavix-ports"
version = "0.1.0"
description = "SeaVix ports — the interfaces that keep GCP out of service code."
requires-python = ">=3.14"
dependencies = [
    "firebase-admin>=7.0.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seavix_ports"]
